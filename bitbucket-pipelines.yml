pipelines:
  branches:
    staging:
      - step:
          name: Login to aws staging ecr
          image: amazon/aws-cli
          services:
            - docker
          script:
            - export AWS_ACCESS_KEY_ID=$STAG_AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$STAG_AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=$STAG_AWS_DEFAULT_REGION
            - export REGISTRY_URL=$STAG_REGISTRY_URL
            # aws login
            - aws ecr get-login-password | docker login --username AWS --password-stdin $REGISTRY_URL
            - cp /root/.docker/config.json .
          artifacts:
            - config.json
      - step:
          name: Build & Push nginx proxy image to staging
          image: amazon/aws-cli
          services:
            - docker
          script:
            - export REGISTRY_URL=$STAG_REGISTRY_URL
            - BITBUCKET_COMMIT_SHORT="${BITBUCKET_COMMIT::7}"
            - mkdir /root/.docker && mv config.json /root/.docker/
            - docker build -t $REGISTRY_URL/${STAGING_TASK_NGINX_PROXY}-${BITBUCKET_COMMIT_SHORT} -f proxy/nginx/Dockerfile .
            - docker push $REGISTRY_URL/${STAGING_TASK_NGINX_PROXY}-${BITBUCKET_COMMIT_SHORT}
      - step:
          name: Build & Push php app image to staging
          image: amazon/aws-cli
          services:
            - docker
          script:
            - export REGISTRY_URL=$STAG_REGISTRY_URL
            - BITBUCKET_COMMIT_SHORT="${BITBUCKET_COMMIT::7}"
            - mkdir /root/.docker && mv config.json /root/.docker/
            - docker build -t $REGISTRY_URL/${STAGING_TASK_PHP_APP}-${BITBUCKET_COMMIT_SHORT} -f proxy/php/Dockerfile .
            - docker push $REGISTRY_URL/${STAGING_TASK_PHP_APP}-${BITBUCKET_COMMIT_SHORT}
      - step:
          name: terraform plan on staging
          image: hashicorp/terraform:latest
          services:
            - docker
          script:
            - export AWS_ACCESS_KEY_ID=$STAG_AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$STAG_AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=$STAG_AWS_DEFAULT_REGION
            - BITBUCKET_COMMIT_SHORT=$(echo "${BITBUCKET_COMMIT}" | cut -c 1-7)
            - cd iac
            - terraform init -backend-config environment/staging/backend.hcl
            - terraform plan -var=nginx_image_tag="${STAGING_TASK_NGINX_PROXY}-${BITBUCKET_COMMIT_SHORT}" -var=phpapp_image_tag="${STAGING_TASK_PHP_APP}-${BITBUCKET_COMMIT_SHORT}" -var-file environment/staging/terraform.tfvars
      - step:
          name: terraform apply to staging
          image: hashicorp/terraform:latest
          services:
            - docker
          script:
            - export AWS_ACCESS_KEY_ID=$STAG_AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$STAG_AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=$STAG_AWS_DEFAULT_REGION
            - BITBUCKET_COMMIT_SHORT=$(echo "${BITBUCKET_COMMIT}" | cut -c 1-7)
            - cd iac
            - terraform init -backend-config environment/staging/backend.hcl
            - terraform apply -auto-approve -var=nginx_image_tag="${STAGING_TASK_NGINX_PROXY}-${BITBUCKET_COMMIT_SHORT}" -var=phpapp_image_tag="${STAGING_TASK_PHP_APP}-${BITBUCKET_COMMIT_SHORT}" -var-file="environment/staging/terraform.tfvars"
    master:
      - step:
          name: Build and Push NGINX Image to Production ECR
          image: amazonlinux:latest
          services:
            - docker
          script:
            - yum update -y
            - yum install -y curl-minimal python3 python3-pip tar gzip
            - pip3 install awscli --upgrade
            - BITBUCKET_COMMIT_SHORT=$(echo "${BITBUCKET_COMMIT}" | cut -c 1-5)
            - export AWS_ACCESS_KEY_ID=$PROD_AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$PROD_AWS_SECRET_ACCESS_KEY
            - export AWS_REGION=$PROD_AWS_DEFAULT_REGION
            - export AWS_ACCOUNT_ID=$PROD_AWS_ACC
            - export REPOSITORY_NAME="${PRODUCTION_ECR}"
            - export IMAGE_TAG="nginx-${BITBUCKET_COMMIT_SHORT}"
            - ECR_URL="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_URL
            - docker build -f proxy/nginx/Dockerfile -t $ECR_URL/$REPOSITORY_NAME:$IMAGE_TAG .
            - docker push $ECR_URL/$REPOSITORY_NAME:$IMAGE_TAG
      - step:
          name: Build and Push PHP Image to Production ECR
          image: amazonlinux:latest
          services:
            - docker
          script:
            - yum update -y
            - yum install -y curl-minimal python3 python3-pip tar gzip
            - pip3 install awscli --upgrade
            - BITBUCKET_COMMIT_SHORT=$(echo "${BITBUCKET_COMMIT}" | cut -c 1-5)
            - export AWS_ACCESS_KEY_ID=$PROD_AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$PROD_AWS_SECRET_ACCESS_KEY
            - export AWS_REGION=$PROD_AWS_DEFAULT_REGION
            - export AWS_ACCOUNT_ID=$PROD_AWS_ACC
            - export REPOSITORY_NAME="${PRODUCTION_ECR}"
            - export IMAGE_TAG="php-${BITBUCKET_COMMIT_SHORT}"
            - ECR_URL="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_URL
            - docker build -f proxy/php/Dockerfile -t $ECR_URL/$REPOSITORY_NAME:$IMAGE_TAG .
            - docker push $ECR_URL/$REPOSITORY_NAME:$IMAGE_TAG
      - step:
          name: Terraform plan on production
          image: hashicorp/terraform:latest
          services:
            - docker
          script:
            - export AWS_ACCESS_KEY_ID=$PROD_AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$PROD_AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=$PROD_AWS_DEFAULT_REGION
            - BITBUCKET_COMMIT_SHORT=$(echo "${BITBUCKET_COMMIT}" | cut -c 1-5)
            - PROD_ECR=$PRODUCTION_ECR
            - NGINX_TAG="${PROD_ECR}:nginx-${BITBUCKET_COMMIT_SHORT}"
            - PHP_TAG="${PROD_ECR}:php-${BITBUCKET_COMMIT_SHORT}"
            - VAR_FILE="environment/production/terraform.tfvars"
            - cd iac
            - terraform init -backend-config environment/production/backend.hcl
            - terraform plan -var=nginx_image_tag=$NGINX_TAG -var=phpapp_image_tag=$PHP_TAG -var-file=$VAR_FILE
      - step:
          name: Terraform apply to production
          image: hashicorp/terraform:latest
          services:
            - docker
          script:
            - export AWS_ACCESS_KEY_ID=$PROD_AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$PROD_AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=$PROD_AWS_DEFAULT_REGION
            - BITBUCKET_COMMIT_SHORT=$(echo "${BITBUCKET_COMMIT}" | cut -c 1-5)
            - PROD_ECR=$PRODUCTION_ECR
            - NGINX_TAG="${PROD_ECR}:nginx-${BITBUCKET_COMMIT_SHORT}"
            - PHP_TAG="${PROD_ECR}:php-${BITBUCKET_COMMIT_SHORT}"
            - VAR_FILE="environment/production/terraform.tfvars"
            - cd iac
            - terraform init -backend-config environment/production/backend.hcl
            - terraform apply -auto-approve -var=nginx_image_tag=$NGINX_TAG -var=phpapp_image_tag=$PHP_TAG -var-file=$VAR_FILE
