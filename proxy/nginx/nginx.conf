user  nginx;
worker_processes  auto;  # Automatically adjusts based on the number of CPU cores
worker_rlimit_nofile 20480;  # Increase this to match server's capacity for open files

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 20480;  # Increase worker connections to handle more concurrent clients
    multi_accept on;  # Accept multiple connections at once
    use epoll;  # Optimize for Linux by using epoll (or kqueue for BSD systems)
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enable detailed logging for debugging and tracking request times
    log_format custom_format '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             '$request_time $upstream_response_time $pipe';

    access_log  /var/log/nginx/access.log custom_format;  # Use custom log format

    sendfile        on;       # Enable efficient file transmission
    tcp_nopush      on;       # Reduce network latency by sending headers and file content in one go
    tcp_nodelay     on;       # Send the response immediately instead of waiting for packets to accumulate

    keepalive_timeout  300;   # Keep connections alive for 300 seconds
    keepalive_requests 7500;  # Allow multiple requests over a single keep-alive connection

    # Gzip compression for better performance (enable if not enabled in individual server block)
    gzip on;
    gzip_disable "msie6";  # Disable Gzip for older IE browsers that don't support it
    gzip_vary on;          # Ensure gzip is enabled for varying responses
    gzip_proxied any;
    gzip_min_length 1000;  # Minimum file size to compress
    gzip_buffers 16 8k;
    gzip_comp_level 2;     # Compression level: balance between speed and compression ratio
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Buffers and timeouts for large requests
    client_body_buffer_size 16k;  # Default client body buffer size
    client_header_buffer_size 1k;  # Default client header buffer size
    large_client_header_buffers 4 8k;  # Allocate more buffers for larger headers

    # Timeouts
    client_body_timeout 180s;      # Time to wait for the client to send body
    client_header_timeout 180s;    # Time to wait for the client to send headers
    send_timeout 60s;             # Time to send response to the client

    # Open file cache for improved performance
    open_file_cache max=2000 inactive=20s;  # Cache 2000 file descriptors
    open_file_cache_valid 30s;              # Cache validation time
    open_file_cache_min_uses 2;             # Only cache files that are accessed more than twice
    open_file_cache_errors on;              # Cache errors when accessing files

    include /etc/nginx/conf.d/*.conf;
}
